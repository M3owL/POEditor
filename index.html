<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tłumacz PO - RU -> PL</title>
  <style>
    :root {
      --bg: #121214;
      --card: #1a1a1e;
      --border: #2e2e35;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --green: #22c55e;
      --red: #ef4444;
      --text: #e4e4e7;
      --text-muted: #a1a1aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    #sidebar { width: 350px; background: #161619; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border); }
    .file-input { display: none; }
    .btn-file { display: block; text-align: center; background: var(--accent); color: #fff; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .progress-box { padding: 15px; border-bottom: 1px solid var(--border); }
    .progress-bar-bg { background: #27272a; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 8px; margin-bottom: 10px; }
    .progress-bar-fill { background: var(--green); height: 100%; width: 0%; transition: width 0.2s; }
    .btn-clear { background: #3f3f46; color: white; border: none; width: 100%; padding: 6px; border-radius: 4px; font-size: 11px; cursor: pointer; text-transform: uppercase; font-weight: bold; }
    .btn-clear:hover { background: var(--red); }
    
    .batch-actions { padding: 10px 15px; border-bottom: 1px solid var(--border); background: #1a1a1e; display: flex; flex-direction: column; gap: 8px; }
    .batch-row { display: flex; gap: 8px; }
    
    .entry-list { flex: 1; overflow-y: auto; }
    .list-item { padding: 10px 15px; border-bottom: 1px solid #222226; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .list-item:hover { background: #202025; }
    .list-item.active { background: #272730; border-left: 4px solid var(--accent); }
    .list-item input[type="checkbox"] { cursor: pointer; transform: scale(1.2); }
    
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
    .badge-done { background: rgba(34, 197, 94, 0.2); color: var(--green); }
    .badge-todo { background: rgba(161, 161, 170, 0.1); color: var(--text-muted); }

    /* Main Content */
    #main { flex: 1; display: flex; flex-direction: column; padding: 25px; gap: 20px; overflow-y: auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; }
    .card-title { font-size: 12px; font-weight: bold; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0.5px; }
    .source-text { font-size: 16px; white-space: pre-wrap; line-height: 1.5; }
    .en-preview { color: #38bdf8; font-style: italic; min-height: 24px; }
    
    textarea, input[type="number"] { background: #121214; border: 1px solid var(--border); border-radius: 6px; color: #fff; padding: 12px; font-size: 15px; outline: none; }
    textarea { width: 100%; height: 120px; resize: vertical; }
    textarea:focus, input[type="number"]:focus { border-color: var(--accent); }
    input[type="number"] { padding: 8px; width: 70px; text-align: center; }

    .actions { display: flex; justify-content: space-between; align-items: center; }
    .btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: #27272a; color: var(--text); margin-right: 10px; }
    .btn-secondary:hover { background: #3f3f46; }
    .btn-outline { border: 1px solid var(--accent); color: var(--accent); background: transparent; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; text-align: center; width: 100%; font-size: 12px;}
    .btn-outline:hover { background: rgba(99, 102, 241, 0.1); }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="sidebar-header">
      <label class="btn-file">Wgraj nowy plik .PO <input type="file" id="po-file" class="file-input" accept=".po"></label>
    </div>
    <div class="progress-box">
      <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:bold;">
        <span>Postęp</span>
        <span id="progress-text">0 / 0 (0%)</span>
      </div>
      <div class="progress-bar-bg"><div id="progress-bar" class="progress-bar-fill"></div></div>
      <button class="btn-clear" onclick="clearProgress()">Wyczyść zapis</button>
    </div>
    
    <div class="batch-actions">
      <div class="batch-row">
        <input type="number" id="auto-check-count" placeholder="+ ile?" min="1">
        <button class="btn-outline" onclick="autoCheckDown()">Zaznacz w dół</button>
      </div>
      <button class="btn-outline" onclick="applyBatchDuplicates()">Wypełnij zaznaczone duplikaty</button>
    </div>

    <div class="entry-list" id="entry-list"></div>
    <div style="padding:15px; border-top: 1px solid var(--border);">
      <button class="btn" style="width:100%;" onclick="exportPO()">Pobierz przetłumaczony PO</button>
    </div>
  </div>

  <div id="main">
    <div class="card">
      <div class="card-title">Oryginał (Rosyjski)</div>
      <div id="src-ru" class="source-text">Wgraj plik lub kontynuuj z zapisu...</div>
    </div>

    <div class="card">
      <div class="card-title">Podgląd Kontekstu (Angielski - Auto)</div>
      <div id="src-en" class="source-text en-preview">-</div>
    </div>

    <div class="card">
      <div class="card-title">Polskie Tłumaczenie</div>
      <textarea id="target-pl" placeholder="Wpisz tłumaczenie..." oninput="autoSaveText()"></textarea>
    </div>

    <div class="actions">
      <div>
        <button class="btn btn-secondary" onclick="navigate(-1)">Poprzedni</button>
        <button class="btn btn-secondary" onclick="navigate(1)">Następny</button>
      </div>
      <button class="btn" onclick="approveAndNext()">Zatwierdź i Następny (Ctrl+Enter)</button>
    </div>
  </div>

<script>
  let entries = [];
  let currentIndex = 0;

  window.onload = function() {
    const savedData = localStorage.getItem('po_translator_progress');
    if (savedData) {
      const parsed = JSON.parse(savedData);
      entries = parsed.entries;
      currentIndex = parsed.currentIndex || 0;
      if (entries.length > 0) {
        renderList();
        loadEntry(currentIndex);
      }
    }
  };

  function saveState() {
    if (entries.length === 0) return;
    const dataToSave = { entries, currentIndex };
    localStorage.setItem('po_translator_progress', JSON.stringify(dataToSave));
  }

  function clearProgress() {
    if (confirm('Na pewno? Skasujesz cały aktualny postęp w przeglądarce.')) {
      localStorage.removeItem('po_translator_progress');
      location.reload();
    }
  }

  function autoSaveText() {
    if (entries[currentIndex]) {
      entries[currentIndex].pl = document.getElementById('target-pl').value;
      saveState();
    }
  }

  document.getElementById('po-file').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      parsePO(evt.target.result);
    };
    reader.readAsText(file);
  });

  function parsePO(text) {
    entries = [];
    const rawBlocks = text.split(/\n\r?\n/);
    
    rawBlocks.forEach(block => {
      if (!block.includes('msgid')) return;
      
      const msgidMatch = block.match(/msgid\s+"([\s\S]*?)"(?=\nmsgstr)/);
      const msgstrMatch = block.match(/msgstr\s+"([\s\S]*?)"$/);

      if (msgidMatch) {
        const cleanRu = unescapePO(msgidMatch[1]);
        const cleanPl = msgstrMatch ? unescapePO(msgstrMatch[1]) : '';
        
        entries.push({
          rawHeader: block.substring(0, block.indexOf('msgid')),
          ru: cleanRu,
          pl: cleanPl,
          approved: false
        });
      }
    });

    currentIndex = 0;
    saveState();
    renderList();
    loadEntry(0);
  }

  function unescapePO(str) {
    return str.replace(/\\n/g, '\n').replace(/\\r/g, '\r').replace(/\\"/g, '"');
  }

  function escapePO(str) {
    return str.replace(/"/g, '\\"').replace(/\r\n/g, '\\r\\n').replace(/\n/g, '\\n');
  }

  function renderList() {
    const listEl = document.getElementById('entry-list');
    listEl.innerHTML = '';
    
    entries.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = `list-item ${idx === currentIndex ? 'active' : ''}`;
      div.onclick = () => saveAndGo(idx);
      
      const textPreview = item.ru.substring(0, 25) || 'Puste';
      const badge = item.approved 
        ? '<span class="badge badge-done">GOTOWE</span>' 
        : '<span class="badge badge-todo">DO ROBIENIA</span>';
      
      div.innerHTML = `
        <div style="display: flex; align-items: center; gap: 10px; max-width: 70%;">
          <input type="checkbox" class="batch-cb" data-idx="${idx}" onclick="event.stopPropagation()">
          <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${idx + 1}. ${escapeHtml(textPreview)}</span>
        </div>
        ${badge}
      `;
      listEl.appendChild(div);
    });

    updateProgress();
  }

  function updateProgress() {
    const approvedCount = entries.filter(e => e.approved).length;
    const total = entries.length;
    const percent = total ? Math.round((approvedCount / total) * 100) : 0;
    
    document.getElementById('progress-text').innerText = `${approvedCount} / ${total} (${percent}%)`;
    document.getElementById('progress-bar').style.width = `${percent}%`;
  }

  function loadEntry(idx) {
    if (!entries[idx]) return;
    currentIndex = idx;
    saveState();
    
    const entry = entries[idx];
    document.getElementById('src-ru').innerText = entry.ru;
    document.getElementById('target-pl').value = entry.pl;
    document.getElementById('src-en').innerText = 'Tłumaczenie...';

    fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=ru&tl=en&dt=t&q=${encodeURIComponent(entry.ru)}`)
      .then(res => res.json())
      .then(data => {
        const enText = data[0].map(x => x[0]).join('');
        document.getElementById('src-en').innerText = enText;
      })
      .catch(() => {
        document.getElementById('src-en').innerText = '[Błąd podglądu EN]';
      });

    document.querySelectorAll('.list-item').forEach((el, i) => {
      if (i === idx) el.classList.add('active');
      else el.classList.remove('active');
    });
  }

  function saveAndGo(targetIndex) {
    if (entries[currentIndex]) {
      entries[currentIndex].pl = document.getElementById('target-pl').value;
      saveState();
    }
    loadEntry(targetIndex);
  }

  function approveAndNext() {
    if (!entries[currentIndex]) return;
    entries[currentIndex].pl = document.getElementById('target-pl').value;
    entries[currentIndex].approved = true;
    saveState();
    
    if (currentIndex + 1 < entries.length) {
      renderList();
      loadEntry(currentIndex + 1);
    } else {
      renderList();
      alert('Koniec pliku!');
    }
  }

  // Funkcja automatycznie zaznaczająca X checkboxów poniżej pierwszego zaznaczonego
  function autoCheckDown() {
    const countInput = document.getElementById('auto-check-count').value;
    const count = parseInt(countInput);
    if (isNaN(count) || count <= 0) {
      alert('Wpisz poprawną liczbę do zaznaczenia!');
      return;
    }

    const allCheckboxes = Array.from(document.querySelectorAll('.batch-cb'));
    const firstCheckedIndex = allCheckboxes.findIndex(cb => cb.checked);

    if (firstCheckedIndex === -1) {
      alert('Zaznacz najpierw jeden startowy element na liście!');
      return;
    }

    let checkedCount = 0;
    for (let i = firstCheckedIndex + 1; i < allCheckboxes.length && checkedCount < count; i++) {
      allCheckboxes[i].checked = true;
      checkedCount++;
    }
  }

  function applyBatchDuplicates() {
    const checkboxes = document.querySelectorAll('.batch-cb:checked');
    if (checkboxes.length === 0) {
      alert('Zaznacz najpierw checkboxy przy tłumaczeniach na liście.');
      return;
    }

    const translationsMap = {};
    let totalUpdated = 0;

    checkboxes.forEach(cb => {
      const idx = parseInt(cb.getAttribute('data-idx'));
      const entry = entries[idx];
      translationsMap[entry.ru] = entry.pl;
    });

    entries.forEach(entry => {
      if (translationsMap.hasOwnProperty(entry.ru)) {
        if (!entry.approved || entry.pl !== translationsMap[entry.ru]) {
          entry.pl = translationsMap[entry.ru];
          entry.approved = true;
          totalUpdated++;
        }
      }
    });

    saveState();
    renderList();
    
    document.getElementById('target-pl').value = entries[currentIndex].pl;
    alert(`Zrobione. Nadpisano i zatwierdzono łącznie ${totalUpdated} wpisów.`);
  }

  function navigate(dir) {
    const newIdx = currentIndex + dir;
    if (newIdx >= 0 && newIdx < entries.length) {
      saveAndGo(newIdx);
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'Enter') {
      approveAndNext();
    }
  });

  function exportPO() {
    if (!entries.length) return;
    let output = '';
    
    entries.forEach(e => {
      output += e.rawHeader;
      output += `msgid "${escapePO(e.ru)}"\n`;
      output += `msgstr "${escapePO(e.pl)}"\n\n`;
    });

    const blob = new Blob([output], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Game_Pl_translated.po';
    a.click();
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>
</body>
</html>
