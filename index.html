<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tłumacz PO / XLSX</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #121214;
      --card: #1a1a1e;
      --border: #2e2e35;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --green: #22c55e;
      --red: #ef4444;
      --text: #e4e4e7;
      --text-muted: #a1a1aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

    #sidebar { width: 350px; background: #161619; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 15px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
    .lang-select { background: #27272a; color: white; border: 1px solid var(--border); border-radius: 4px; padding: 6px; font-size: 12px; width: 100%; outline: none; }
    .file-input { display: none; }
    .btn-file { display: block; text-align: center; background: var(--accent); color: #fff; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .progress-box { padding: 15px; border-bottom: 1px solid var(--border); }
    .progress-bar-bg { background: #27272a; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 8px; margin-bottom: 10px; }
    .progress-bar-fill { background: var(--green); height: 100%; width: 0%; transition: width 0.2s; }
    .btn-clear { background: #3f3f46; color: white; border: none; width: 100%; padding: 6px; border-radius: 4px; font-size: 11px; cursor: pointer; text-transform: uppercase; font-weight: bold; }
    .btn-clear:hover { background: var(--red); }
    
    .batch-actions { padding: 10px 15px; border-bottom: 1px solid var(--border); background: #1a1a1e; display: flex; flex-direction: column; gap: 8px; }
    .batch-row { display: flex; gap: 8px; }
    
    .entry-list { flex: 1; overflow-y: auto; }
    .list-item { padding: 10px 15px; border-bottom: 1px solid #222226; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .list-item:hover { background: #202025; }
    .list-item.active { background: #272730; border-left: 4px solid var(--accent); }
    .list-item input[type="checkbox"] { cursor: pointer; transform: scale(1.2); }
    
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
    .badge-done { background: rgba(34, 197, 94, 0.2); color: var(--green); }
    .badge-todo { background: rgba(161, 161, 170, 0.1); color: var(--text-muted); }

    #main { flex: 1; display: flex; flex-direction: column; padding: 25px; gap: 20px; overflow-y: auto; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; }
    .card-title { font-size: 12px; font-weight: bold; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; letter-spacing: 0.5px; }
    .source-text { font-size: 16px; white-space: pre-wrap; line-height: 1.5; }
    .en-preview { color: #38bdf8; font-style: italic; min-height: 24px; }
    
    textarea, input[type="number"] { background: #121214; border: 1px solid var(--border); border-radius: 6px; color: #fff; padding: 12px; font-size: 15px; outline: none; }
    textarea { width: 100%; height: 120px; resize: vertical; }
    textarea:focus, input[type="number"]:focus { border-color: var(--accent); }
    input[type="number"] { padding: 8px; width: 70px; text-align: center; }

    .actions { display: flex; justify-content: space-between; align-items: center; }
    .btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: #27272a; color: var(--text); margin-right: 10px; }
    .btn-secondary:hover { background: #3f3f46; }
    .btn-outline { border: 1px solid var(--accent); color: var(--accent); background: transparent; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; text-align: center; width: 100%; font-size: 12px;}
    .btn-outline:hover { background: rgba(99, 102, 241, 0.1); }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="sidebar-header">
      <select id="lang-src" class="lang-select">
        <option value="ru">Oryginał: Rosyjski</option>
        <option value="en">Oryginał: Angielski</option>
        <option value="de">Oryginał: Niemiecki</option>
      </select>
      <select id="lang-prev" class="lang-select">
        <option value="en">Podgląd: Angielski</option>
        <option value="ru">Podgląd: Rosyjski</option>
        <option value="pl">Podgląd: Polski</option>
      </select>
      <select id="lang-tgt" class="lang-select">
        <option value="pl">Cel: Polski</option>
      </select>
      
      <label class="btn-file">Wgraj plik (.PO / .XLSX) <input type="file" id="file-input" class="file-input" accept=".po, .xlsx"></label>
    </div>
    <div class="progress-box">
      <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:bold;">
        <span>Postęp</span>
        <span id="progress-text">0 / 0 (0%)</span>
      </div>
      <div class="progress-bar-bg"><div id="progress-bar" class="progress-bar-fill"></div></div>
      <button class="btn-clear" onclick="clearProgress()">Wyczyść zapis</button>
    </div>
    
    <div class="batch-actions">
      <div class="batch-row">
        <input type="number" id="auto-check-count" placeholder="+ ile?" min="1">
        <button class="btn-outline" onclick="autoCheckDown()">Zaznacz w dół</button>
      </div>
      <button class="btn-outline" onclick="applyBatchDuplicates()">Wypełnij zaznaczone duplikaty</button>
    </div>

    <div class="entry-list" id="entry-list"></div>
    <div style="padding:15px; border-top: 1px solid var(--border);">
      <button class="btn" style="width:100%;" onclick="exportFile()">Pobierz Przetłumaczony Plik</button>
    </div>
  </div>

  <div id="main">
    <div class="card">
      <div class="card-title" id="card-src-title">Oryginał</div>
      <div id="src-text" class="source-text">Wgraj plik lub kontynuuj z zapisu...</div>
    </div>

    <div class="card">
      <div class="card-title" id="card-prev-title">Podgląd Kontekstu (Auto)</div>
      <div id="prev-text" class="source-text en-preview">-</div>
    </div>

    <div class="card">
      <div class="card-title" id="card-tgt-title">Tłumaczenie</div>
      <textarea id="target-text" placeholder="Wpisz tłumaczenie..." oninput="autoSaveText()"></textarea>
    </div>

    <div class="actions">
      <div>
        <button class="btn btn-secondary" onclick="navigate(-1)">Poprzedni</button>
        <button class="btn btn-secondary" onclick="navigate(1)">Następny</button>
      </div>
      <button class="btn" onclick="approveAndNext()">Zatwierdź i Następny (Ctrl+Enter)</button>
    </div>
  </div>

<script>
  let entries = [];
  let currentIndex = 0;

  window.onload = function() {
    const savedData = localStorage.getItem('translator_progress');
    if (savedData) {
      const parsed = JSON.parse(savedData);
      entries = parsed.entries;
      currentIndex = parsed.currentIndex || 0;
      if (entries.length > 0) {
        renderList();
        loadEntry(currentIndex);
      }
    }
  };

  function saveState() {
    if (entries.length === 0) return;
    const dataToSave = { entries, currentIndex };
    localStorage.setItem('translator_progress', JSON.stringify(dataToSave));
  }

  function clearProgress() {
    if (confirm('Na pewno? Skasujesz cały aktualny postęp w przeglądarce.')) {
      localStorage.removeItem('translator_progress');
      location.reload();
    }
  }

  function autoSaveText() {
    if (entries[currentIndex]) {
      entries[currentIndex].target = document.getElementById('target-text').value;
      saveState();
    }
  }

  document.getElementById('file-input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const ext = file.name.split('.').pop().toLowerCase();
    const reader = new FileReader();
    
    if (ext === 'po') {
      reader.onload = function(evt) { parsePO(evt.target.result); };
      reader.readAsText(file, 'UTF-8');
    } else if (ext === 'xlsx') {
      reader.onload = function(evt) { parseXLSX(evt.target.result); };
      reader.readAsArrayBuffer(file);
    } else {
      alert('Nieobsługiwany format pliku!');
    }
  });

  // Dekodowanie tylko dla plików PO
  function decodeTextPO(str) {
    if (!str) return '';
    return String(str)
      .replace(/\\n/g, '\n')
      .replace(/\\r/g, '\r')
      .replace(/\\t/g, '\t')
      .replace(/\\"/g, '"');
  }

  // Kodowanie tylko dla plików PO
  function encodeTextPO(str) {
    if (!str) return '';
    return String(str)
      .replace(/"/g, '\\"')
      .replace(/\r\n/g, '\\r\\n')
      .replace(/\n/g, '\\n')
      .replace(/\t/g, '\\t');
  }

  function parsePO(text) {
    entries = [];
    const rawBlocks = text.split(/\n\r?\n/);
    
    rawBlocks.forEach(block => {
      if (!block.includes('msgid')) return;
      const msgidMatch = block.match(/msgid\s+"([\s\S]*?)"(?=\nmsgstr)/);
      const msgstrMatch = block.match(/msgstr\s+"([\s\S]*?)"$/);

      if (msgidMatch) {
        entries.push({
          type: 'po',
          rawHeader: block.substring(0, block.indexOf('msgid')),
          source: decodeTextPO(msgidMatch[1]),
          target: msgstrMatch ? decodeTextPO(msgstrMatch[1]) : '',
          approved: false
        });
      }
    });
    initData();
  }

  function parseXLSX(data) {
    const workbook = XLSX.read(data, { type: 'array', raw: true });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const json = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true });
    
    entries = [];
    for(let i = 1; i < json.length; i++) {
      const row = json[i];
      if(!row || (row[0] === undefined && row[2] === undefined)) continue;
      
      entries.push({
        type: 'xlsx',
        id: row[0] !== undefined ? String(row[0]) : '',
        context: row[1] !== undefined ? String(row[1]) : '',
        // Dla XLSX wczytujemy tekst w 100% naturalnie
        source: row[2] !== undefined ? String(row[2]) : '',
        target: row[3] !== undefined ? String(row[3]) : '',
        approved: false
      });
    }
    initData();
  }

  function initData() {
    currentIndex = 0;
    saveState();
    renderList();
    loadEntry(0);
  }

  function renderList() {
    const listEl = document.getElementById('entry-list');
    listEl.innerHTML = '';
    
    entries.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = `list-item ${idx === currentIndex ? 'active' : ''}`;
      div.onclick = () => saveAndGo(idx);
      
      const textPreview = item.source.substring(0, 25) || 'Puste';
      const badge = item.approved 
        ? '<span class="badge badge-done">GOTOWE</span>' 
        : '<span class="badge badge-todo">DO ROBIENIA</span>';
      
      div.innerHTML = `
        <div style="display: flex; align-items: center; gap: 10px; max-width: 70%;">
          <input type="checkbox" class="batch-cb" data-idx="${idx}" onclick="event.stopPropagation()">
          <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${idx + 1}. ${escapeHtml(textPreview)}</span>
        </div>
        ${badge}
      `;
      listEl.appendChild(div);
    });

    updateProgress();
  }

  function updateProgress() {
    const approvedCount = entries.filter(e => e.approved).length;
    const total = entries.length;
    const percent = total ? Math.round((approvedCount / total) * 100) : 0;
    
    document.getElementById('progress-text').innerText = `${approvedCount} / ${total} (${percent}%)`;
    document.getElementById('progress-bar').style.width = `${percent}%`;
  }

  function loadEntry(idx) {
    if (!entries[idx]) return;
    currentIndex = idx;
    saveState();
    
    const entry = entries[idx];
    document.getElementById('src-text').innerText = entry.source;
    document.getElementById('target-text').value = entry.target;
    document.getElementById('prev-text').innerText = 'Tłumaczenie API...';

    const srcEl = document.getElementById('lang-src');
    const prevEl = document.getElementById('lang-prev');
    const tgtEl = document.getElementById('lang-tgt');
    
    document.getElementById('card-src-title').innerText = `Oryginał (${srcEl.options[srcEl.selectedIndex].text.split(': ')[1]})`;
    document.getElementById('card-prev-title').innerText = `Podgląd (${prevEl.options[prevEl.selectedIndex].text.split(': ')[1]})`;
    document.getElementById('card-tgt-title').innerText = `Tłumaczenie (${tgtEl.options[tgtEl.selectedIndex].text.split(': ')[1]})`;

    const sl = srcEl.value;
    const tl = prevEl.value;

    fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(entry.source)}`)
      .then(res => res.json())
      .then(data => {
        document.getElementById('prev-text').innerText = data[0].map(x => x[0]).join('');
      })
      .catch(() => {
        document.getElementById('prev-text').innerText = '[Błąd podglądu API]';
      });

    document.querySelectorAll('.list-item').forEach((el, i) => {
      if (i === idx) el.classList.add('active');
      else el.classList.remove('active');
    });
  }

  function saveAndGo(targetIndex) {
    if (entries[currentIndex]) {
      entries[currentIndex].target = document.getElementById('target-text').value;
      saveState();
    }
    loadEntry(targetIndex);
  }

  function approveAndNext() {
    if (!entries[currentIndex]) return;
    entries[currentIndex].target = document.getElementById('target-text').value;
    entries[currentIndex].approved = true;
    saveState();
    
    if (currentIndex + 1 < entries.length) {
      renderList();
      loadEntry(currentIndex + 1);
    } else {
      renderList();
      alert('Koniec pliku!');
    }
  }

  function autoCheckDown() {
    const count = parseInt(document.getElementById('auto-check-count').value);
    if (isNaN(count) || count <= 0) {
      alert('Wpisz poprawną liczbę!');
      return;
    }

    const allCheckboxes = Array.from(document.querySelectorAll('.batch-cb'));
    const firstCheckedIndex = allCheckboxes.findIndex(cb => cb.checked);

    if (firstCheckedIndex === -1) {
      alert('Zaznacz najpierw jeden startowy element!');
      return;
    }

    let checkedCount = 0;
    for (let i = firstCheckedIndex + 1; i < allCheckboxes.length && checkedCount < count; i++) {
      allCheckboxes[i].checked = true;
      checkedCount++;
    }
  }

  function applyBatchDuplicates() {
    const checkboxes = document.querySelectorAll('.batch-cb:checked');
    if (checkboxes.length === 0) return alert('Brak zaznaczonych elementów.');

    const translationsMap = {};
    let totalUpdated = 0;

    checkboxes.forEach(cb => {
      const entry = entries[parseInt(cb.getAttribute('data-idx'))];
      translationsMap[entry.source] = entry.target;
    });

    entries.forEach(entry => {
      if (translationsMap.hasOwnProperty(entry.source)) {
        if (!entry.approved || entry.target !== translationsMap[entry.source]) {
          entry.target = translationsMap[entry.source];
          entry.approved = true;
          totalUpdated++;
        }
      }
    });

    saveState();
    renderList();
    document.getElementById('target-text').value = entries[currentIndex].target;
    alert(`Nadpisano i zatwierdzono ${totalUpdated} wpisów.`);
  }

  function navigate(dir) {
    const newIdx = currentIndex + dir;
    if (newIdx >= 0 && newIdx < entries.length) saveAndGo(newIdx);
  }

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'Enter') approveAndNext();
  });

  function exportFile() {
    if (!entries.length) return;
    
    if (entries[0].type === 'xlsx') {
      const wsData = [['ID', 'Context (msgctxt)', 'Source text', 'Translation']];
      
      entries.forEach(e => {
        wsData.push([
          e.id,
          e.context,
          // Eksport XLSX wysyła czysty tekst bez ucieczek typu \n
          e.source,
          e.target
        ]);
      });
      
      const ws = XLSX.utils.aoa_to_sheet(wsData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Translations");
      
      XLSX.writeFile(wb, 'Przetlumaczone.xlsx', { bookType: 'xlsx', compression: true });
    } else {
      let output = '';
      entries.forEach(e => {
        output += e.rawHeader;
        // Eksport PO wymaga kodowania
        output += `msgid "${encodeTextPO(e.source)}"\n`;
        output += `msgstr "${encodeTextPO(e.target)}"\n\n`;
      });
      const blob = new Blob([output], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Przetlumaczone.po';
      a.click();
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>
</body>
</html>
